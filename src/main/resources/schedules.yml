      - '&7&m----------------------'
      - '&d&lTeam List Tip'
      - '&eYou can use /team sort to sort how'
      - '&eyou would like /team list and tablists'
      - '&eteam list to look.'
      - '&7&m----------------------'
    SCHEDULE:
      - '&7&m----------------------'
      - '&d&lScheduler Tip'
      - '&eYou can use /schedule to view'
      - '&ewhat time our events happen.'
      - '&7&m----------------------'
